name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Pester and PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -MinimumVersion 1.21.0 -Scope CurrentUser -Force

      - name: Analyze
        shell: pwsh
        run: |
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($findings) {
            $findings | Format-Table -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer reported $($findings.Count) error(s)."
          }
          Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning |
            Format-Table RuleName, Line, ScriptName -AutoSize

      - name: Test
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0 -Force
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = './Tests'
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $configuration
